# =====================================
# Nginx Configuration para Agendoo
# =====================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # =====================================
    # Configuraciones básicas
    # =====================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # =====================================
    # Optimizaciones de rendimiento
    # =====================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;

    # =====================================
    # Compresión Gzip
    # =====================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # =====================================
    # Rate Limiting
    # =====================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=20r/s;

    # =====================================
    # Upstream para Agendoo API
    # =====================================
    upstream agendoo_backend {
        server agendoo-api:4000;
        keepalive 32;
    }

    # =====================================
    # Servidor HTTP (redirige a HTTPS)
    # =====================================
    server {
        listen 80;
        listen [::]:80;
        server_name tu-dominio.com www.tu-dominio.com;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir todo a HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # =====================================
    # Servidor HTTPS Principal
    # =====================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tu-dominio.com www.tu-dominio.com;

        # =====================================
        # Configuración SSL/TLS
        # =====================================
        ssl_certificate /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;
        
        # Configuraciones SSL modernas
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/tu-dominio.com/chain.pem;

        # =====================================
        # Headers de Seguridad
        # =====================================
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # =====================================
        # GraphQL API Endpoint
        # =====================================
        location /graphql {
            limit_req zone=graphql burst=50 nodelay;
            
            proxy_pass http://agendoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;

            # CORS headers para GraphQL
            add_header Access-Control-Allow-Origin "https://tu-dominio.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;

            # Manejar preflight OPTIONS
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://tu-dominio.com";
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Accept, Authorization, Cache-Control, Content-Type, X-Requested-With";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
        }

        # =====================================
        # API REST Endpoints
        # =====================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://agendoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # =====================================
        # Health Check
        # =====================================
        location /health {
            access_log off;
            proxy_pass http://agendoo_backend/health;
            proxy_set_header Host $host;
        }

        # =====================================
        # WebSocket Support (para subscriptions)
        # =====================================
        location /subscriptions {
            proxy_pass http://agendoo_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # =====================================
        # Assets estáticos (si los tienes)
        # =====================================
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # =====================================
        # Página por defecto
        # =====================================
        location / {
            return 200 '{"message":"Agendoo API is running","status":"healthy","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
    }
}