version: '3.8'

services:
  # =====================================
  # Backend API - Agendoo con soporte de red externa
  # =====================================
  agendoo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: agendoo-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    
    # =====================================
    # Variables de entorno desde archivo
    # =====================================
    env_file:
      - .env.production
    
    environment:
      # Variables críticas
      - NODE_ENV=production
      - PORT=4000
      
      # Variables de base de datos (usar nombres de contenedor si están en la misma red)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-agendoo_db}
      
      # Variables de Redis
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # Autenticación
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      
      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-not_configured}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-not_configured}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-not_configured}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-not_configured}
      
      # Configuraciones
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
    
    # =====================================
    # Configuración de red
    # =====================================
    networks:
      - agendoo-network
    
    # Para desarrollo local o cuando no hay red externa
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    volumes:
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # Nginx - Proxy reverso
  # =====================================
  nginx:
    image: nginx:alpine
    container_name: agendoo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agendoo-api
    networks:
      - agendoo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# =====================================
# Configuración de redes
# =====================================
networks:
  agendoo-network:
    # Si la red externa existe, la usa; si no, crea una nueva
    external: ${EXTERNAL_NETWORK:-false}
    name: ${NETWORK_NAME:-agendoo_agendoo-network}
    # Si no es externa, usa configuración por defecto
    driver: ${NETWORK_DRIVER:-bridge}

volumes:
  nginx_logs:
    driver: local