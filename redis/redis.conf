# =====================================
# Redis Configuration SIMPLE para Agendoo
# Solo lo esencial para empezar
# =====================================

# Red
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Directorio de trabajo
dir /data

# Log
loglevel notice
logfile ""

# Memoria
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistencia básica
save 900 1
save 300 10  
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Configuración para cache
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

# Bases de datos
databases 16

# Seguridad básica
# requirepass se configura vía variables de entorno