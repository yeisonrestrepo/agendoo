x-common: &common
  restart: unless-stopped
  networks:
    - deriv-network
  stop_signal: SIGTERM
  stop_grace_period: 30s

volumes:
  postgres_data:

services:
  deriv-postgres:
    image: postgres:15-alpine
    container_name: deriv-postgres
    restart: unless-stopped
    networks:
      - deriv-network
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agendoo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-agendoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db-init:
    image: postgres:15-alpine
    restart: "no"
    networks:
      - deriv-network
    environment:
      PGHOST: deriv-postgres
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-agendoo}
    command: >
      sh -c "
        until pg_isready; do echo 'waiting for postgres...'; sleep 2; done;
        psql -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='$$PGDATABASE'\" | grep -q 1 ||
        psql -d postgres -c \"CREATE DATABASE \\\"$$PGDATABASE\\\"\";
        echo 'database ready.'
      "
    depends_on:
      deriv-postgres:
        condition: service_healthy

  migrate:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=deriv-postgres
      - DB_PORT=5432
    command: ["./node_modules/.bin/typeorm", "migration:run", "-d", "dist/data-source.js"]
    depends_on:
      - db-init

  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agendoo-api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=deriv-postgres
      - DB_PORT=5432
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  deriv-network:
    external: true
