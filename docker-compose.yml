services:
  # =====================================
  # Solo Backend API - Agendoo
  # =====================================
  agendoo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: agendoo-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    
    # =====================================
    # Variables de entorno desde archivo
    # =====================================
    env_file:
      - .env.production
    
    # =====================================
    # Sobrescribir variables específicas
    # =====================================
    environment:
      - NODE_ENV=production
      - PORT=4000
      - RUN_MIGRATIONS=false  # Deshabilitar hasta configurar TypeORM
    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # Nginx - Solo HTTP
  # =====================================
  nginx:
    image: nginx:alpine
    container_name: agendoo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agendoo-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nginx_logs:
    driver: local