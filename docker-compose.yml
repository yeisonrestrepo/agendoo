services:
  # =====================================
  # Solo Backend API - Agendoo
  # =====================================
  agendoo-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: agendoo-api
    restart: unless-stopped
    ports:
      - "4000:4000"

    # =====================================
    # OPCIÓN 1: Usar archivo .env.production directamente
    # =====================================
    env_file:
      - .env.production

    # =====================================
    # OPCIÓN 2: Interpolación de variables (opcional)
    # =====================================
    environment:
      # Estas sobrescriben las del archivo si es necesario
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      # Las demás variables vienen del .env.production

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
    networks:
      - deriv-trading-bot_trading-network
    external: true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =====================================
  # Nginx (Opcional)
  # =====================================
  nginx:
    image: nginx:alpine
    container_name: agendoo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agendoo-api
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

# No necesitamos volúmenes para PostgreSQL/Redis
volumes:
  nginx_logs:
    driver: local

networks:
  deriv-trading-bot_trading-network:
    external: true