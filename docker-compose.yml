x-common: &common
  restart: unless-stopped
  networks:
    - deriv-network
  stop_signal: SIGTERM
  stop_grace_period: 30s

services:
  # Creates the agendoo database inside the shared deriv-postgres instance if it
  # does not already exist, then exits. Runs before migrations on every deploy
  # but is a no-op once the database has been created.
  db-init:
    image: postgres:15-alpine
    restart: "no"
    networks:
      - deriv-network
    environment:
      PGHOST: deriv-postgres
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-agendoo}
    command: >
      sh -c "
        until pg_isready; do echo 'waiting for postgres...'; sleep 2; done;
        psql -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='$$PGDATABASE'\" | grep -q 1 ||
        psql -d postgres -c \"CREATE DATABASE \\\"$$PGDATABASE\\\"\";
        echo 'database ready.'
      "

  migrate:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=deriv-postgres
      - DB_PORT=5432
    command: ["./node_modules/.bin/typeorm", "migration:run", "-d", "dist/data-source.js"]
    depends_on:
      - db-init

  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agendoo-api
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=deriv-postgres
      - DB_PORT=5432
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  # Reuses the existing network created by deriv-trading-deploy.
  # Run "docker compose up" in deriv-trading-deploy first so this network exists.
  deriv-network:
    external: true
